# Fallback only. The target VPS uses Caddy — see Caddyfile.example and COEXIST.md.
#
# Drop-in for a VPS that already has nginx in front of another app.
# Do NOT replace the existing server{} — add these two (or one) vhosts.
#
# DNS:
#   call.example.com      A   <server ip>
#   (optional) keep the existing app on app.example.com / example.com
#
# Signaling goes through 443/WSS. Media (UDP 7882, TURN 3478) must still
# hit the host directly — nginx cannot proxy WebRTC UDP.

upstream line_ui {
    server 127.0.0.1:3080;
    keepalive 16;
}

upstream line_livekit {
    server 127.0.0.1:7880;
    keepalive 16;
}

# Token API + custom UI
server {
    listen 443 ssl http2;
    server_name call.example.com;

    # ssl_certificate     /etc/letsencrypt/live/call.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/call.example.com/privkey.pem;

    location /api/ {
        proxy_pass http://line_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://line_ui;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# LiveKit signaling (WSS). Use a second name, or a location prefix.
# Second hostname is simpler and avoids path-stripping bugs with the SDK.
server {
    listen 443 ssl http2;
    server_name livekit.example.com;

    # ssl_certificate     /etc/letsencrypt/live/livekit.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/livekit.example.com/privkey.pem;

    location / {
        proxy_pass http://line_livekit;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
