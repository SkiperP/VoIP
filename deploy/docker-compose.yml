# LiveKit + token/UI next to an existing app on the same machine.
#
# Does not bind 80 or 443. Signaling/UI stay on loopback; the existing Caddy
# adds two server_name blocks (see Caddyfile.example).
#
# Host firewall must allow:
#   TCP 7881, UDP 7882 (media mux), UDP 3478 (TURN).
#
# Public HTTPS to this IP is dropped on the path (TLS Client Hello never
# arrives). The `tunnel` service opens an SSH reverse tunnel to Pinggy
# (outbound TCP 443) and writes https://*.pinggy.* to runtime/https-url.

name: line

services:
  livekit:
    image: livekit/livekit-server:v1.13.6
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit.yaml
      - --keys
      - "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"

  app:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        VITE_BASE: ${VITE_BASE:-/call/}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: ${APP_PORT:-3080}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL}
      HTTPS_URL_FILE: /app/runtime/https-url
    volumes:
      - ./runtime:/app/runtime:ro
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3080"
    depends_on:
      - livekit

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - livekit

  tunnel:
    build:
      context: .
      dockerfile: Dockerfile.tunnel
    restart: unless-stopped
    environment:
      TUNNEL_ORIGIN_HOST: edge
      TUNNEL_ORIGIN_PORT: "80"
      HTTPS_URL_FILE: /runtime/https-url
    volumes:
      - ./runtime:/runtime
    depends_on:
      - edge
